services:
  varuna-forecast-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: varuna_ai_forecasting_platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=varuna-ai-production-sih26080-scientific-forecast-key
      - DEBUG=True
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - FAST_BOOT=0

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

networks:
  default:
    name: varuna_network

