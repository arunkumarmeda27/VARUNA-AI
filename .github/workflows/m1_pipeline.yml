name: VARUNA-AI M1 Data Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  m1-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install M1 dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy xarray netCDF4 pyarrow scikit-learn scipy joblib xgboost cdsapi

      - name: Validate M1 orchestration
        run: |
          python weather_data/run_m1_pipeline.py --ci

      - name: Verify M1 handoff
        run: |
          python weather_data/create_m1_handoff.py
          test -f weather_data/processed/real_ml/M1_DATA_HANDOFF.md

      - name: Verify M1 reports
        run: |
          test -f weather_data/processed/real_ml/M1_CI_ORCHESTRATION_REPORT.txt
          test -f weather_data/processed/real_ml/M1_REAL_DATA_BACKTEST_RESULTS.txt
          test -f weather_data/processed/real_ml/M1_TASK_1_2_REPORT.md
          test -f weather_data/processed/real_ml/VARUNA_AI_ML_DATASET_METADATA.txt

      - name: Verify M1 pipeline source scripts
        run: |
          test -f weather_data/run_m1_pipeline.py
          test -f weather_data/build_real_ml_dataset.py
          test -f weather_data/add_rainfall_features.py
          test -f weather_data/merge_weather_features.py
          test -f weather_data/validate_weather_merge.py
          test -f weather_data/train_model_v3.py
          test -f weather_data/feature_importance_v3.py
          test -f weather_data/m1_backtest_real_data.py
          test -f weather_data/create_ml_metadata.py
          test -f weather_data/create_m1_handoff.py

      - name: Verify large scientific data remains external
        run: |
          if git ls-files 'weather_data/raw/*' | grep -q .; then
            echo "ERROR: raw scientific data is tracked in Git."
            exit 1
          fi

          if git ls-files '*.parquet' | grep -q .; then
            echo "ERROR: large Parquet datasets are tracked in Git."
            exit 1
          fi

          echo "Large real-data files are correctly kept outside Git."

      - name: Upload M1 documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VARUNA-AI-M1-validation-${{ github.run_number }}
          if-no-files-found: error
          path: |
            weather_data/processed/real_ml/M1_DATA_HANDOFF.md
            weather_data/processed/real_ml/M1_CI_ORCHESTRATION_REPORT.txt
            weather_data/processed/real_ml/M1_REAL_DATA_BACKTEST_RESULTS.txt
            weather_data/processed/real_ml/M1_TASK_1_2_REPORT.md
            weather_data/processed/real_ml/VARUNA_AI_ML_DATASET_METADATA.txt
