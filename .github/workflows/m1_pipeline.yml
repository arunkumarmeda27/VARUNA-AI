name: VARUNA-AI M1 Training Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  m1-training:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy xarray netCDF4 pyarrow scikit-learn scipy joblib xgboost cdsapi

      - name: Validate M1 orchestration
        run: |
          python weather_data/run_m1_pipeline.py --ci

      - name: Verify M1 handoff
        run: |
          python weather_data/create_m1_handoff.py
          test -f weather_data/processed/real_ml/M1_DATA_HANDOFF.md

      - name: Verify training dataset availability
        run: |
          test -f weather_data/processed/train_v1.0.0.parquet
          test -f weather_data/processed/val_v1.0.0.parquet
          test -f weather_data/processed/test_v1.0.0.parquet

      - name: Train weather regime classifier
        run: |
          python regimes/training/train_classifier.py

      - name: Train and evaluate rainfall correction models
        run: |
          python correction/evaluation/evaluate_correction.py

      - name: Run scientific verification
        run: |
          python verification/verify.py

      - name: Upload M1 training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VARUNA-AI-M1-training-${{ github.run_number }}
          path: |
            weather_data/processed/real_ml/M1_DATA_HANDOFF.md
            weather_data/processed/real_ml/M1_CI_ORCHESTRATION_REPORT.txt
            regimes/models/
            regimes/artifacts/
            regimes/evaluation/
            correction/artifacts/
            correction/evaluation/
            verification/results.csv
            verification/verification_matrix.json